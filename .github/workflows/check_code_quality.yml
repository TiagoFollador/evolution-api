name: Check Code Quality

on:
  pull_request:
    branches: [ main, develop, 'nexo/**' ]
  push:
    branches: [ main, develop, 'nexo/**' ]

jobs:
  check-lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Node
      uses: actions/setup-node@v5
      with:
        node-version: 20.x

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install packages
      run: npm ci
    
    - name: Check linting
      run: npm run lint:check

    - name: Generate Prisma client
      run: npm run db:generate
      env:
        DATABASE_PROVIDER: postgresql

    - name: Check build
      run: npm run build

    # Golden-file suite: pins the Meta channel's current database writes and
    # outbound events so the Nexo refactor phases cannot change them silently.
    - name: Run tests
      run: npm test